<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232833"/>
      <stop offset="1" stop-color="#161a21"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc8c"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1116"/>
      <stop offset="1" stop-color="#1d222b"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b25e"/>
      <stop offset="0.5" stop-color="#8a6d2f"/>
      <stop offset="1" stop-color="#d8b25e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- plate -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="495" height="495" rx="103.5" fill="none" stroke="url(#border)" stroke-width="3" opacity="0.85"/>
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.05"/>

  <!-- toggle track -->
  <rect x="92" y="212" width="328" height="136" rx="68" fill="url(#track)"/>
  <rect x="94" y="214" width="324" height="132" rx="66" fill="none" stroke="#000000" stroke-width="2" opacity="0.4"/>
  <rect x="96" y="216" width="320" height="128" rx="64" fill="url(#track)"/>

  <!-- SD label (dimmed side) -->
  <text x="166" y="300" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58" text-anchor="middle" fill="#7d828c" letter-spacing="1">SD</text>

  <!-- gold glow behind knob -->
  <circle cx="352" cy="280" r="84" fill="#e9c96a" opacity="0.35" filter="url(#glow)"/>

  <!-- HD knob -->
  <circle cx="352" cy="280" r="86" fill="url(#knob)" filter="url(#drop)"/>
  <circle cx="352" cy="280" r="86" fill="none" stroke="#f9e9b0" stroke-width="2" opacity="0.8"/>
  <circle cx="352" cy="256" r="70" fill="#ffffff" opacity="0.14"/>

  <text x="352" y="302" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="62" text-anchor="middle" fill="#2b2113" letter-spacing="1">HD</text>

  <!-- wordmark -->
  <text x="256" y="432" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="34" text-anchor="middle" fill="#c8cbd2" letter-spacing="6">FOREVER MODELS</text>
</svg>
